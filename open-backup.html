<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>فتح نسخة خالد تريد الاحتياطية</title>
<style>body{font-family:system-ui,Tahoma,sans-serif;background:#0f1b33;color:#eef;margin:0;padding:20px}.c{max-width:480px;margin:auto;background:#17264a;border-radius:16px;padding:20px}input,button{width:100%;box-sizing:border-box;padding:14px;margin:8px 0;border-radius:12px;border:1px solid #3a4b78;background:#0f1b33;color:#fff;font:inherit}button{background:#2f6bd6;border:0;font-weight:700}#o{white-space:pre-wrap;font-size:14px}</style></head><body><div class="c">
<h2>🔓 فتح نسخة خالد تريد الاحتياطية</h2>
<p>الصفحة دي بتشتغل على جهازك بس ومبتبعتش حاجة لأي مكان. اختار ملف النسخة (.enc.json) واكتب باسورد البيانات.</p>
<input type="file" id="f" accept=".json,application/json"><input type="password" id="p" placeholder="باسورد البيانات"><button onclick="go()">فتح</button><div id="o"></div><button id="d" style="display:none" onclick="dl()">⬇️ تنزيل البيانات (JSON غير مشفر)</button></div>
<script>
let D=null;const b=x=>Uint8Array.from(atob(x),c=>c.charCodeAt(0));
async function go(){const o=document.getElementById('o');try{const f=document.getElementById('f').files[0];if(!f)return o.textContent='اختار الملف الأول';
const j=JSON.parse(await f.text()),pw=document.getElementById('p').value.trim();o.textContent='⏳ بيفك التشفير...';
const k0=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b(j.salt),iterations:j.it,hash:'SHA-256'},k0,{name:'AES-GCM',length:256},false,['decrypt']);
D=JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b(j.iv)},k,b(j.ct))));const d=D.db||{};
o.textContent='✅ اتفتحت\nتاريخ النسخة: '+(D.created||'')+'\nأصناف: '+(d.products||[]).length+'\nعملاء: '+(d.customers||[]).length+'\nموردين: '+(d.suppliers||[]).length+'\nفواتير: '+(d.invoices||[]).length+'\nمستخدمين: '+(d.users||[]).length;document.getElementById('d').style.display='block'}
catch(e){o.textContent='⚠️ الباسورد غلط أو الملف مش ملف نسخة صحيح'}}
function dl(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(D,null,1)],{type:'application/json'}));a.download='khaled-trade-data.json';a.click()}
</script></body></html>
